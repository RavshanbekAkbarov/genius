# O'zbekcha so'zlar ovozini yaratib, shu branch'ga commit qiladi.
# words.json yoki skript o'zgarganda o'zi ishlaydi; qo'lda ham ishga tushirish mumkin.
name: Uzbek audio

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/data/words.json"
      - "tool/uz_audio.py"
      - ".github/workflows/uz-audio.yml"

concurrency:
  group: uz-audio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts==7.3.1
      - run: python tool/uz_audio.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/uz
          if git diff --cached --quiet; then
            echo "Yangi ovoz yo'q."
          else
            du -sh assets/audio/uz
            git commit -q -m "O'zbekcha ovoz fayllari (avtomatik)"
            git push
          fi
