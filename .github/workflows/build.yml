name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Sinov uchun APK (debug kalit bilan imzolangan). Actions sahifasidan "genius-apk" ni yuklab, telefonga o'rnatiladi.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: genius-apk
          path: build/app/outputs/flutter-apk/app-release.apk
