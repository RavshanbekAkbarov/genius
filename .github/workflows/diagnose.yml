name: Diagnose

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch release APK on emulator and collect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p uz.auraacademy.genius -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof uz.auraacademy.genius || echo "APP NOT RUNNING"
            adb logcat -d > logcat.txt
            echo "=== CRASH BUFFER ==="
            adb logcat -d -b crash | tail -80
            echo "=== FATAL / flutter lines ==="
            grep -E "FATAL|AndroidRuntime|flutter|F/|E/flutter|Exception|Error" logcat.txt | tail -120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
